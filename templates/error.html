<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionGuard - Request Error</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <span class="nav-brand">🛡️ VisionGuard <span class="badge-tag">23L-0994_A2_Ops</span></span>
            <div class="nav-links">
                <a href="/">Inspector</a>
                <a href="/history">Audit History</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="card error-card">
            <div class="error-icon">⚠️</div>
            <h1 class="error-code">Error {{ code }}</h1>
            <h2 class="error-title">{{ title }}</h2>
            <p class="error-message">{{ message }}</p>

            <div class="error-actions">
                <a href="/" class="btn btn-primary">Return to Inspector</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>VisionGuard Validation Handler &bull; Roll Number: <strong>23L-0994</strong></p>
    </footer>
</body>
</html>
